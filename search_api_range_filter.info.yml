name: 'Search API Range Filter'
type: module
description: 'Provides a Search API Views filter for range-overlap queries across two index fields (e.g. date_start / date_end). Works with any backend; the year-dropdown widget on date fields requires Elasticsearch.'
package: 'Custom'
core_version_requirement: ^10 || ^11
dependencies:
  - drupal:views
  - search_api:search_api
